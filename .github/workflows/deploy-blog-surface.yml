name: Deploy blog surface

# Why this workflow exists
# ----------------------
# The publish valve writes documents into the PrincepsBlog database. Nothing in
# this repo turned those documents into a live URL, and the only deploy pipeline
# that existed (Azure Static Web Apps) had failed on every run since 2026-05-20
# and cannot serve an SSR/ISR Next.js app. This workflow is the deploy path of
# record: Vercel, prebuilt in CI, gated on the surface actually answering.
#
# Gates, in order. Each one exists because its failure mode is silent:
#   1. preflight — secrets present, else notice-and-skip (never permanently red)
#   2. env       — MONGODB_DATABASE_URL reached the build, else the site builds empty
#   3. build     — `vercel build --prod` emits at least one /blogs/* route
#   4. probe     — real slug 200 with real bytes, fabricated slug 404, hero 200
#
# Secret-guarded on purpose: with no VERCEL_TOKEN the workflow emits a notice and
# skips instead of going permanently red. It arms itself when secrets land.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A production deploy must never be cancelled by a subsequent push.
# A cancelled run is not a failed run: GitHub renders it grey, the commit is not
# marked failed, and production silently keeps serving the previous build. This
# is the same defect class as `cancel-in-progress: true` on a deploy job, which
# is exactly what bit the previous pipeline. Serialize; do not cancel.
concurrency:
  group: deploy-blog-surface-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      armed: ${{ steps.preflight.outputs.armed }}
    steps:
      - name: Preflight — secrets present
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::notice::missing $v"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::notice::Vercel secrets not configured — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to repo secrets to arm this workflow."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.armed == 'true'

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.armed == 'true'
        with:
          node-version: '20'
          # package-lock.json IS committed at the repo root (377 KB, verified).
          # `cache: npm` depends on that lockfile — do not remove either.
          cache: npm

      - name: Install
        if: steps.preflight.outputs.armed == 'true'
        # `npm install`, not `npm ci`: the lockfile predates the 2026-05-20 era
        # and `npm ci` hard-fails on drift, which would make this workflow
        # unrunnable for an environmental reason. Vercel's own default is the
        # same command, so CI and deploy resolve identically.
        run: npm install

      - name: Install Vercel CLI
        if: steps.preflight.outputs.armed == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        if: steps.preflight.outputs.armed == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Gate — MONGODB_DATABASE_URL reached the build
        if: steps.preflight.outputs.armed == 'true'
        run: |
          # Without this var the blog page's DB read throws, getDbBlogs() catches
          # it and returns [], and `next build` exits 0 with ZERO /blogs/* routes.
          # That is a green build and a 404 site — the exact failure this repo
          # spent a day inside. Fail in 20s instead of after a full build+deploy.
          ENVFILE=".vercel/.env.production.local"
          if ! grep -q '^MONGODB_DATABASE_URL=.\+' "$ENVFILE" 2>/dev/null; then
            echo "::error::MONGODB_DATABASE_URL is not set on the Vercel project (Production env)."
            echo "::error::Set it in Vercel → Project → Settings → Environment Variables, then re-run."
            echo "::error::Without it the build succeeds and emits zero blog routes."
            exit 1
          fi
          echo "MONGODB_DATABASE_URL present in the pulled production env."

      - name: Build (prebuilt)
        if: steps.preflight.outputs.armed == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Gate — build emitted blog routes
        if: steps.preflight.outputs.armed == 'true'
        run: |
          count=$(find .vercel/output -path '*blogs*' -name '*.html' 2>/dev/null | wc -l)
          echo "blog html routes in prebuilt output: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::Build produced zero /blogs/* routes — the DB read returned nothing."
            exit 1
          fi

      - name: Deploy (prebuilt)
        if: steps.preflight.outputs.armed == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

  probe:
    name: Probe the live surface (L3 gate)
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip if deploy was not armed
        if: needs.deploy.outputs.armed != 'true'
        run: |
          echo "::notice::Deploy was not armed (no Vercel secrets) — nothing to probe."

      # The four gates are inlined rather than calling scripts/verify_blog_surface.sh.
      # That script does not exist in this repo; a probe that warns-and-skips when
      # its helper is missing is the same silent-green failure mode this workflow
      # was built to catch. If this job runs, every assertion runs.
      - name: Probe real slug, fabricated slug, apex redirect, hero image
        if: needs.deploy.outputs.armed == 'true'
        run: |
          set -u
          BASE="https://princepspolycap.com"
          REAL_SLUG="running-an-ai-company-on-a-clock"
          FAKE_SLUG="slug-that-does-not-exist-zzz999"
          fail=0

          probe() { # url -> "status bytes content_type"
            curl -sS -o /tmp/body -w '%{http_code} %{size_download} %{content_type}' \
                 -L --max-time 30 -A 'poly-deploy-probe/1.0' "$1" || echo "000 0 -"
          }

          echo "── Gate 1: real slug must be 200 with real bytes ──"
          read -r s b c <<<"$(probe "$BASE/blogs/$REAL_SLUG")"
          echo "GET /blogs/$REAL_SLUG -> $s, $b bytes, $c"
          if [ "$s" != "200" ]; then
            echo "::error::real slug returned $s, expected 200"; fail=1
          elif [ "$b" -lt 20000 ]; then
            # A real Next.js article page is tens of KB. The catch-all stub that
            # currently answers this domain returns an identical 114 bytes on
            # EVERY path, including fabricated slugs. Byte size is the tell.
            echo "::error::real slug returned only $b bytes — this is the catch-all stub, not the app"; fail=1
          fi

          echo "── Gate 2: fabricated slug must be 404 ──"
          read -r s2 b2 _c2 <<<"$(probe "$BASE/blogs/$FAKE_SLUG")"
          echo "GET /blogs/$FAKE_SLUG -> $s2, $b2 bytes"
          if [ "$s2" != "404" ]; then
            echo "::error::fabricated slug returned $s2, expected 404 — the domain is not served by this app"; fail=1
          fi

          echo "── Gate 3: apex must redirect to www ──"
          # next.config.js declares a permanent apex->www redirect. If apex
          # answers 200 directly, that config is not the thing serving the domain.
          apex=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 "$BASE/" || echo "000 ")
          echo "GET / -> $apex"
          case "$apex" in
            301*|308*) echo "apex redirects — ok" ;;
            *) echo "::error::apex returned '$apex', expected a 301/308 redirect to www"; fail=1 ;;
          esac

          echo "── Gate 4: hero image must be fetchable anonymously ──"
          # Extract the first hero/src URL from the real article rather than
          # hardcoding one: asset URLs are workspace-scoped blob paths and change
          # per post. If we cannot find one, say so explicitly instead of passing.
          read -r _s _b _c <<<"$(probe "$BASE/blogs/$REAL_SLUG")"
          cp /tmp/body /tmp/article.html 2>/dev/null || true
          HERO=$(grep -oE 'src="[^"]+\.(jpg|jpeg|png|webp)"' /tmp/article.html 2>/dev/null \
                 | head -1 | sed -E 's/^src="//; s/"$//')
          if [ -z "${HERO:-}" ]; then
            echo "::warning::no hero image found in the article HTML — gate 4 not asserted."
            echo "::warning::Either the post has no hero, or assets are broken at render time. Check manually."
          else
            case "$HERO" in
              http*) HERO_URL="$HERO" ;;
              /*)    HERO_URL="$BASE$HERO" ;;
              *)     HERO_URL="$BASE/$HERO" ;;
            esac
            read -r s4 b4 c4 <<<"$(probe "$HERO_URL")"
            echo "GET $HERO_URL -> $s4, $b4 bytes, $c4"
            if [ "$s4" != "200" ]; then
              echo "::error::hero image returned $s4 — assets are not publicly reachable"
              echo "::error::root-relative /api/local-blobs paths resolve to a route this app does not own"
              fail=1
            fi
            case "$c4" in
              image/*) echo "hero served as $c4 — ok" ;;
              *) echo "::error::hero returned content-type '$c4', expected image/*"; fail=1 ;;
            esac
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::L3 gate failed. Two distinct causes, do not confuse them:"
            echo "::error::  (a) build is broken            -> fix the build"
            echo "::error::  (b) domain not attached to this -> move princepspolycap.com onto the Vercel project"
            echo "::error::      Vercel project               (apex currently serves a 114-byte catch-all stub)"
            exit 1
          fi
          echo ""
          echo "All four L3 gates passed. The blog surface is live."
