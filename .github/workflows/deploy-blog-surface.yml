name: Deploy blog surface

# Why this workflow exists
# ----------------------
# The publish valve writes documents into the PrincepsBlog database. Nothing in
# this repo turned those documents into a live URL, and the only deploy pipeline
# that existed (Azure Static Web Apps) had failed on every run since 2026-05-20
# and cannot serve an SSR/ISR Next.js app. This workflow is the deploy path of
# record: Vercel, built prebuilt in CI, gated on the surface actually answering.
#
# Gates, in order. Each one exists because its failure mode is silent:
#   1. preflight — secrets present, else notice-and-skip (never permanently red)
#   2. env       — MONGODB_DATABASE_URL reached the build, else the site builds empty
#   3. build     — `vercel build --prod` emits at least one /blogs/* route
#   4. probe     — real slug 200 with real bytes, fabricated slug 404, hero 200
#
# Secret-guarded on purpose: with no VERCEL_TOKEN the workflow emits a notice and
# skips instead of going permanently red. It arms itself when secrets land.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A production deploy must never be cancelled by a subsequent push.
# A cancelled run is not a failed run: GitHub renders it grey, the commit is not
# marked failed, and production silently keeps serving the previous build. This
# is the same defect class as `cancel-in-progress: true` on a deploy job, which
# is exactly what bit the previous pipeline. Serialize; do not cancel.
concurrency:
  group: deploy-blog-surface-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preflight — secrets present
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::notice::missing $v"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::notice::Vercel secrets not configured — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to repo secrets to arm this workflow."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.armed == 'true'

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.armed == 'true'
        with:
          node-version: '20'
          # package-lock.json IS committed at the repo root (377 KB, verified).
          # `cache: npm` depends on that lockfile — do not remove either.
          cache: npm

      - name: Install
        if: steps.preflight.outputs.armed == 'true'
        # `npm install`, not `npm ci`: the lockfile predates the 2026-05-20 era
        # and `npm ci` hard-fails on drift, which would make this workflow
        # unrunnable for an environmental reason. Vercel's own default is the
        # same command, so CI and deploy resolve identically.
        run: npm install

      - name: Install Vercel CLI
        if: steps.preflight.outputs.armed == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        if: steps.preflight.outputs.armed == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Gate — MONGODB_DATABASE_URL reached the build
        if: steps.preflight.outputs.armed == 'true'
        run: |
          # Without this var the blog page's DB read throws, getDbBlogs() catches
          # it and returns [], and `next build` exits 0 with ZERO /blogs/* routes.
          # That is a green build and a 404 site — the exact failure this repo
          # spent a day inside. Fail in 20s instead of after a full build+deploy.
          ENVFILE=".vercel/.env.production.local"
          if ! grep -q '^MONGODB_DATABASE_URL=.\+' "$ENVFILE" 2>/dev/null; then
            echo "::error::MONGODB_DATABASE_URL is not set on the Vercel project (Production env)."
            echo "::error::Set it in Vercel → Project → Settings → Environment Variables, then re-run."
            echo "::error::Without it the build succeeds and emits zero blog routes."
            exit 1
          fi
          echo "MONGODB_DATABASE_URL present in the pulled production env."

      - name: Build (prebuilt)
        if: steps.preflight.outputs.armed == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Gate — build emitted blog routes
        if: steps.preflight.outputs.armed == 'true'
        run: |
          count=$(find .vercel/output -path '*blogs*' -name '*.html' 2>/dev/null | wc -l)
          echo "blog html routes in prebuilt output: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::Build produced zero /blogs/* routes — the DB read returned nothing."
            exit 1
          fi

      - name: Deploy (prebuilt)
        if: steps.preflight.outputs.armed == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

  probe:
    name: Probe the live surface
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe real slug, fabricated slug, hero image
        run: |
          # A failure here has two distinct causes and they must not be confused:
          #   - build broken        -> fix the build
          #   - domain not attached -> move princepspolycap.com onto this Vercel
          #                            project. The current apex serves a
          #                            catch-all stub answering 200 with an
          #                            identical 114-byte body on EVERY path,
          #                            including fabricated slugs.
          # The script distinguishes them by status code and byte size.
          if [ -f scripts/verify_blog_surface.sh ]; then
            bash scripts/verify_blog_surface.sh "https://princepspolycap.com"
          else
            echo "::warning::scripts/verify_blog_surface.sh not present — probe skipped."
            echo "::warning::Run the four gates manually: real slug 200 + tens of KB, fabricated slug 404, apex->www redirect, hero image 200 for an anonymous request."
          fi
