name: Deploy blog surface

# Why this workflow exists
# ----------------------
# The publish valve writes documents into the PrincepsBlog database. Nothing in
# this repo turned those documents into a live URL, and the only deploy pipeline
# that does exist here (.github/workflows/azure-static-web-apps-brave-pebble-
# 073f29e0f.yml) has been failing on every push to main since 2026-05-20 while
# the public host answers every path with an identical 114-byte stub.
#
# Design constraint: this file must be safe to land BEFORE the credentials
# exist. So it SKIPS (green) when the Vercel secrets are missing, instead of
# failing preflight on every push and turning main red. It becomes live the
# moment VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are set.
#
# It never reports a deployment as successful without the surface verification
# gate passing. "The deploy step exited 0" is not evidence that a URL works.
#
# Read docs/deploy/blog-surface-deployment.md before changing anything here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-blog-${{ github.ref }}
  # Never cancel a production deploy in flight. With cancel-in-progress: true a
  # second push to main kills the running deploy; if that newer run then SKIPS
  # (preflight finds no Vercel secrets) the older run is already dead and nothing
  # deploys, with main green and no URL published. Queue instead of cancel.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight - deploy credentials present
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check secrets
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            eval "value=\${$name}"
            if [ -z "${value:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Missing deploy credentials:$missing. No deployment was attempted and no URL was published. See docs/deploy/blog-surface-deployment.md section 3."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy to Vercel
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `vercel pull --environment=production` materialises the project's
      # production env vars (MONGODB_DATABASE_URL, BLOG_ASSET_ORIGIN) into
      # .vercel/.env.production.local, which `vercel build --prod` then reads.
      # Those vars live in the VERCEL PROJECT, not in repo secrets: the build
      # runs in CI but the environment is the project's.
      - name: Pull Vercel project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          set -eu
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n1)
          case "$url" in
            https://*) ;;
            *) echo "::error::Deploy did not return a deployment URL: $url"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Gate - the deployment must serve a real post
        run: |
          chmod +x scripts/deploy/verify_blog_surface.sh
          scripts/deploy/verify_blog_surface.sh "${{ steps.deploy.outputs.url }}"

      - name: Gate - the apex host must serve that same surface
        run: |
          scripts/deploy/verify_blog_surface.sh "https://princepspolycap.com"

  probe:
    name: Probe the live surface (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reports, does not fail: this job exists to tell a human what the public
      # hosts are actually serving right now. Exit codes are documented in
      # docs/deploy/blog-surface-deployment.md section 5.
      - name: Probe apex, www, and the Vercel default host
        run: |
          chmod +x scripts/deploy/verify_blog_surface.sh
          echo "--- apex ---"
          scripts/deploy/verify_blog_surface.sh "https://princepspolycap.com" || true
          echo "--- www ---"
          scripts/deploy/verify_blog_surface.sh "https://www.princepspolycap.com" || true
          echo "--- vercel default host ---"
          scripts/deploy/verify_blog_surface.sh "https://princepspolycap.vercel.app" || true
