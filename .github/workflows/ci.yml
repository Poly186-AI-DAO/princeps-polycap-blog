name: ci

# This repo had zero workflow runs before this file existed: no build gate, no deploy
# job, no record that a deploy was ever attempted. The blog site was never deployed —
# not stale, not crashed, absent (measured 2026-11-18, task d721bc20).
#
# Design rule, learned expensively: a gate that can pass while verifying nothing is
# worse than no gate. Every check below fails on the specific state it exists to catch,
# and a gate whose credentials are missing reports as SKIPPED (grey), never as passed.
#
# Where the two env vars have to live (review finding B3):
#   MONGODB_DATABASE_URL -> repository secret  AND  Vercel project Production env
#     The repo secret feeds the build gate here.
#     The Vercel project env is what `vercel build` / the deployed function actually use.
#     Setting only the repo secret reproduces the green-and-empty failure exactly.
#   MONGODB_DB_NAME (optional) -> repository variable AND Vercel project env.
#     Defaults to PrincepsBlog in src/lib/mongodb.js.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PULL REQUEST builds only.
# A push to main runs the production deploy. Cancelling it leaves main merged-but-
# undeployed with nothing red anywhere — the exact failure this file exists to prevent.
# Deploys serialise instead of cancelling (see the deploy job's concurrency group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXPECTED_MIN_POSTS: '1'
  # The week-1 published set. Override with a repository variable, never a code edit.
  EXPECTED_BLOG_SLUGS: ${{ vars.EXPECTED_BLOG_SLUGS || 'running-an-ai-company-on-a-clock,an-attempt-produces-the-specification' }}
  BLOG_PUBLIC_BASE_URL: ${{ vars.BLOG_PUBLIC_BASE_URL || 'https://www.princepspolycap.com' }}
  BLOG_APEX_URL: ${{ vars.BLOG_APEX_URL || 'https://princepspolycap.com' }}

jobs:
  preflight:
    name: preflight (credential probe)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_db_url: ${{ steps.probe.outputs.has_db_url }}
      has_vercel: ${{ steps.probe.outputs.has_vercel }}
    steps:
      - name: Probe credentials
        id: probe
        env:
          DB_URL: ${{ secrets.MONGODB_DATABASE_URL }}
          V_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          V_ORG: ${{ secrets.VERCEL_ORG_ID }}
          V_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          db=no
          [ -n "${DB_URL}" ] && db=yes
          vercel=no
          if [ -n "${V_TOKEN}" ] && [ -n "${V_ORG}" ] && [ -n "${V_PROJECT}" ]; then vercel=yes; fi
          echo "has_db_url=${db}" >> "$GITHUB_OUTPUT"
          echo "has_vercel=${vercel}" >> "$GITHUB_OUTPUT"
          {
            echo "### Credential probe"
            echo ""
            echo "| requirement | present | if absent |"
            echo "| --- | --- | --- |"
            echo "| \`MONGODB_DATABASE_URL\` (repo secret) | **${db}** | build gate is SKIPPED, not passed |"
            echo "| \`VERCEL_TOKEN\` + \`VERCEL_ORG_ID\` + \`VERCEL_PROJECT_ID\` | **${vercel}** | deploy is SKIPPED, not passed |"
            echo ""
            echo "Grey is not green. A skipped gate has verified nothing."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${db}" = "no" ]; then
            echo "::warning title=build gate disarmed::MONGODB_DATABASE_URL is not a repository secret. The build and route assertions will be SKIPPED, so nothing about the blog surface is being verified. Set the secret to arm the gate."
          fi
          if [ "${vercel}" = "no" ]; then
            echo "::warning title=deploy disarmed::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID incomplete. No deploy will run; merging to main will not publish."
          fi

  build:
    name: build (next build + route assertion)
    needs: preflight
    if: needs.preflight.outputs.has_db_url == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      # Fails BEFORE the build when the DB is unreachable or has no published posts,
      # instead of letting getDbBlogs()' catch produce a green build with zero routes.
      - name: Probe blog database
        env:
          MONGODB_DATABASE_URL: ${{ secrets.MONGODB_DATABASE_URL }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
        run: node .github/scripts/probe-blog-db.mjs

      - name: Build
        env:
          MONGODB_DATABASE_URL: ${{ secrets.MONGODB_DATABASE_URL }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
        run: npm run build

      - name: Assert /blogs/* routes were prerendered
        run: node .github/scripts/assert-blog-routes.mjs

      - name: Upload build manifests on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-manifests
          path: |
            .next/*.json
            .blog-slugs.json
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy (vercel production, prebuilt)
    needs: [preflight, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.has_vercel == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialise deploys, never cancel them. A cancelled production deploy is invisible.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project environment from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      # Closes B3: proves MONGODB_DATABASE_URL exists in the VERCEL PROJECT, not just in
      # repo secrets. `vercel build` resolves env server-side, so a repo-secret-only
      # setup builds an empty site and deploys it green.
      - name: Probe blog database using the Vercel project environment
        run: |
          set -eu
          if [ ! -f ./.vercel/.env.production.local ]; then
            echo "::error title=vercel env missing::vercel pull produced no .vercel/.env.production.local, so the project has no Production environment to build with."
            exit 1
          fi
          set -a
          . ./.vercel/.env.production.local
          set +a
          if [ -z "${MONGODB_DATABASE_URL:-}" ]; then
            echo "::error title=MONGODB_DATABASE_URL missing from Vercel project::It is not set in the Vercel project's Production environment. Repo secrets alone do not reach the build. Add it in Vercel -> Project -> Settings -> Environment Variables -> Production."
            exit 1
          fi
          node .github/scripts/probe-blog-db.mjs

      - name: Build with the project environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -eu
          url="$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "deployment_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${url}"

      # The L3 gate has two distinct failure modes and they need distinct error titles.
      # Collapsing them cost this task eleven hours: "brand domain serves a stub" was
      # read as "the deploy is broken", when the deploy had never happened at all.
      #
      # Gate 1 — the app renders at the deployment URL it just produced. If this fails,
      # the deploy is the problem. It cannot be masked by DNS, a custom domain, or an
      # unattached alias, because it does not touch the brand domain.
      - name: Smoke the deployment URL (does the app render?)
        id: smoke_deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          SLUGS: ${{ env.EXPECTED_BLOG_SLUGS }}
        run: |
          set -eu
          slug="$(printf '%s' "${SLUGS}" | cut -d, -f1)"
          base="${DEPLOYMENT_URL%/}"
          url="${base}/blogs/${slug}"
          code="$(curl -sS -o /tmp/deploy-body.html -w '%{http_code}' -L --max-time 30 "${url}" || true)"
          bytes="$(wc -c < /tmp/deploy-body.html | tr -d ' ')"
          echo "GET ${url} -> ${code} (${bytes} bytes)"
          {
            echo "### Gate 1 — deployment URL"
            echo ""
            echo "| url | status | bytes |"
            echo "| --- | --- | --- |"
            echo "| \`${url}\` | ${code} | ${bytes} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" != "200" ]; then
            echo "::error title=deployed app does not serve the article::GET ${url} returned ${code}. The deployment exists but the article route does not render. Check the 'Assert /blogs/* routes were prerendered' step and the build log for a zero-route build."
            exit 1
          fi
          if [ "${bytes}" -lt 5000 ]; then
            echo "::error title=deployed app returned a stub, not a page::GET ${url} returned 200 with only ${bytes} bytes. The 114-byte catch-all body that stalled this task for eleven hours looks exactly like this. A 200 is not a page."
            exit 1
          fi
          if ! grep -qi '<!doctype html' /tmp/deploy-body.html; then
            echo "::error title=deployed app returned non-HTML::GET ${url} returned 200 and ${bytes} bytes but the body is not an HTML document."
            exit 1
          fi

      # Gate 2 — the goal's own criterion: a live URL on the brand domain that an
      # anonymous human can open. Separate step so that "custom domain not attached yet"
      # reports as exactly that, and never as "the app is broken".
      - name: Smoke the brand domain (goal criterion: live URL at www)
        run: node .github/scripts/smoke-blog-surface.mjs
